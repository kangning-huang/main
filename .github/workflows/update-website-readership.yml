name: Update website readership

on:
  schedule:
    # Once a day, after the previous UTC day has closed.
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: website-readership
  cancel-in-progress: false

jobs:
  update-readership:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aggregate Cloudflare analytics
        run: node --experimental-strip-types scripts/fetch-website-readership.ts
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_ID: "8a8fb09fecadcecfc28c0dbcd2399582"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/data/website-readership.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/website-readership.json
          git commit -m "Update website readership snapshot [automated]"
          git push

      - name: Trigger deploy workflow
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
