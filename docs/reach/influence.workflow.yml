name: Update Reach (OpenAlex influence)

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and print a summary without writing or committing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update-influence
  cancel-in-progress: false

jobs:
  update-influence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The script has no npm dependencies, so no `npm ci` is needed.
      # OPENALEX_API_KEY is optional: without it the run uses OpenAlex's
      # public daily budget (~50 requests per run, well within it).
      - name: Fetch OpenAlex influence data
        run: node scripts/influence/fetch-influence.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}

      - name: Check for changes
        id: check_changes
        if: ${{ !inputs.dry_run }}
        run: |
          git add -N data/influence/
          if git diff --quiet -- src/data/influence.json data/influence/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push snapshot
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/influence.json data/influence/
          git commit -m "Update Reach influence snapshot (OpenAlex) [automated]"
          git push

      - name: Trigger deploy workflow
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
